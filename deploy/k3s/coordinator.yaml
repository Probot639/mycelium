# PoC - untested, fill in when nodes are ready
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mycelium-coordinator
  labels:
    app: mycelium
    component: coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mycelium
      component: coordinator
  template:
    metadata:
      labels:
        app: mycelium
        component: coordinator
    spec:
      containers:
        - name: coordinator
          image: mycelium:latest  # TODO: real registry path
          command: ["mycelium", "spawn", "--listen", "0.0.0.0:7100", "--corpus", "/data/corpus", "--db", "/data/mycelium.db"]
          ports:
            - containerPort: 7100
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mycelium-coordinator-data
---
apiVersion: v1
kind: Service
metadata:
  name: mycelium-coordinator
spec:
  selector:
    app: mycelium
    component: coordinator
  ports:
    - port: 7100
      targetPort: 7100
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mycelium-coordinator-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi  # corpus + sqlite, bump if needed
