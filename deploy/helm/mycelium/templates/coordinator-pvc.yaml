apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mycelium.fullname" . }}-coordinator-data
  labels:
    {{- include "mycelium.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
spec:
  accessModes:
    - {{ .Values.coordinator.storage.accessMode }}
  resources:
    requests:
      storage: {{ .Values.coordinator.storage.size }}
  {{- if .Values.coordinator.storage.storageClassName }}
  storageClassName: {{ .Values.coordinator.storage.storageClassName }}
  {{- end }}
