apiVersion: v1
kind: Service
metadata:
  name: {{ include "mycelium.fullname" . }}-coordinator
  labels:
    {{- include "mycelium.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
spec:
  type: {{ .Values.coordinator.service.type }}
  selector:
    {{- include "mycelium.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
  ports:
    - name: http
      port: {{ .Values.coordinator.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.coordinator.service.type "NodePort") .Values.coordinator.service.nodePort }}
      nodePort: {{ .Values.coordinator.service.nodePort }}
      {{- end }}
