[workspace]
resolver = "2"
members = [
    "crates/mycelium-common",
    "crates/mycelium-coordinator",
    "crates/mycelium-node",
    "crates/mycelium-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
mycelium-common = { path = "crates/mycelium-common" }
mycelium-coordinator = { path = "crates/mycelium-coordinator" }
mycelium-node = { path = "crates/mycelium-node" }

tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
axum = "0.8"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
notify = "7.0"
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
hex = "0.4"
